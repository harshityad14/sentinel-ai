version: "3.8"

# SentinelAI — Minimal Development Compose Placeholder
# Note: In Phase 0, heavy infrastructure (Kafka, PostgreSQL, TimescaleDB, Redis)
# is intentionally deferred and not required to run. Services will be incrementally
# enabled in their corresponding implementation phases.

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: sentinel-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=sentinel_db
      - POSTGRES_USER=sentinel
      - POSTGRES_PASSWORD=sentinel_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sentinel-api
    ports:
      - "8000:8000"
    environment:
      - SENTINEL_ENV=development
      - LOG_LEVEL=DEBUG
      - DATABASE_URL=postgresql://sentinel:sentinel_dev_password@postgres:5432/sentinel_db
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/workspace/apps/api
      - ./packages:/workspace/packages

volumes:
  postgres_data:
