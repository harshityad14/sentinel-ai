[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = [
    "packages/models",
    "packages/ingestion",
    "packages/flow_engine",
    "packages/features",
    "packages/detection",
    "packages/streaming",
    "packages/ai_agent",
    "apps/api",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "N"]
ignore = ["E501", "I001"]
