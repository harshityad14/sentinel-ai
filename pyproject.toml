[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = [
    "packages/models",
    "packages/ingestion",
    "packages/flow_engine",
    "packages/features",
    "packages/detection",
    "packages/ai_agent",
    "apps/api",
]
testpaths = ["tests"]
