[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-features"
version = "0.1.0"
description = "Passive feature engineering and statistical extraction for SentinelAI"
authors = [{ name = "SentinelAI Team" }]
requires-python = ">=3.11"
dependencies = [
    "sentinel-models",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel_features*"]
