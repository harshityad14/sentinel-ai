[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ingestion"
version = "0.1.0"
description = "Passive packet capture and raw header parsers for SentinelAI"
authors = [{ name = "SentinelAI Team" }]
requires-python = ">=3.11"
dependencies = [
    "sentinel-models",
    "scapy>=2.5.0",
]

[project.scripts]
sentinel-ingest = "sentinel_ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel_ingestion*"]
