[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-streaming"
version = "0.1.0"
description = "Real-time distributed streaming pipeline and Kafka event bus for SentinelAI"
authors = [{ name = "SentinelAI Team" }]
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.3.0",
    "pydantic>=2.5.0",
    "sentinel-models",
    "sentinel-features",
    "sentinel-detection",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel_streaming*"]
