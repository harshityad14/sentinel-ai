[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-flow-engine"
version = "0.1.0"
description = "5-tuple bi-directional flow aggregation and sessionization engine for SentinelAI"
authors = [{ name = "SentinelAI Team" }]
requires-python = ">=3.11"
dependencies = [
    "sentinel-models",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel_flow_engine*"]
