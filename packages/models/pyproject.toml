[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-models"
version = "0.1.0"
description = "Canonical domain models, schemas, and telemetry contracts for SentinelAI"
authors = [{ name = "SentinelAI Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel_models*"]
