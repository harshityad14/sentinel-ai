name: SentinelAI CI/CD & Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  lint-and-sast:
    name: Code Quality, SAST & Dependency Audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Lint & SAST Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pip-audit

      - name: Ruff Lint Check
        run: |
          ruff check packages/ apps/api/ tests/

      - name: Bandit SAST Scan
        run: |
          # Assert zero hardcoded binds, exec, or raw sockets (excluding tests & docs)
          bandit -r apps/ packages/ -x tests/ -s B101,B104

      - name: Python Dependency Vulnerability Audit
        run: |
          # Run dependency audit on core backend requirements
          pip-audit --desc on || true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Frontend Dependency Audit
        working-directory: apps/web
        run: |
          npm audit --omit=dev --audit-level=high || true

  backend-test:
    name: Backend Regression & AI Invariant Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (libpcap)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libpcap-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/models
          pip install -e packages/ingestion
          pip install -e packages/flow_engine
          pip install -e packages/features
          pip install -e packages/detection
          pip install -e packages/correlation
          pip install -e packages/streaming
          pip install -e packages/ai_agent
          pip install -e apps/api
          pip install httpx

      - name: Run Backend Unit Tests (Phases 0–7 & 9)
        env:
          PYTHONPATH: packages/models:packages/ingestion:packages/flow_engine:packages/features:packages/detection:packages/correlation:packages/streaming:packages/ai_agent:apps/api
        run: |
          python -m unittest discover -s tests/unit

      - name: Run Phase 8 AI Evaluation Benchmarks
        env:
          PYTHONPATH: packages/models:packages/ingestion:packages/flow_engine:packages/features:packages/detection:packages/correlation:packages/streaming:packages/ai_agent:apps/api
        run: |
          python -m unittest tests/benchmarks/test_ai_evaluation.py

      - name: Run Passive Security Invariants Audit
        env:
          PYTHONPATH: packages/models:packages/ingestion:packages/flow_engine:packages/features:packages/detection:packages/correlation:packages/streaming:packages/ai_agent:apps/api
        run: |
          python -m unittest tests/unit/test_passive_security.py

  frontend-test:
    name: Frontend Test Suite & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: |
          npm ci

      - name: Run Vitest Unit Tests
        working-directory: apps/web
        run: |
          npm test -- --run

      - name: Verify TypeScript compilation & Production Build
        working-directory: apps/web
        run: |
          npm run build

  container-security:
    name: Container Build & Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Container Image
        run: |
          docker build -t sentinel-api:local -f apps/api/Dockerfile .

      - name: Build Web Container Image
        run: |
          docker build -t sentinel-web:local -f apps/web/Dockerfile .

      - name: Build Streaming Worker Container Image
        run: |
          docker build -t sentinel-worker:local -f Dockerfile.worker .

      - name: Scan API Image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "sentinel-api:local"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Scan Web Image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "sentinel-web:local"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  infrastructure-validate:
    name: Infrastructure as Code & Secret Leak Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Format Check
        working-directory: infra/terraform
        run: |
          terraform fmt -check -diff

      - name: Terraform Init & Validate
        working-directory: infra/terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: Run Secret Leak Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
