name: SentinelAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic>=2.5.0 scapy>=2.5.0 scikit-learn>=1.4.0

      - name: Run Unit Tests
        env:
          PYTHONPATH: packages/models:packages/ingestion:packages/flow_engine:packages/features:packages/detection:packages/ai_agent:apps/api:tests
        run: |
          python -m unittest discover -s tests/unit
